# Publishes a GitHub Release when a version tag (v1.2.3) is pushed.
#
# The plugin's updater reads https://api.github.com/repos/<repo>/releases/latest, so a
# release must contain:
#   geekatplay-3d-layers-<version>.ccx   the package (also as geekatplay-3d-layers.ccx)
#   SHA256SUMS.txt                       checksums the updater and installers verify
#   install-*.cmd/.ps1/.command          one-click installers
# Create releases with `npm run release -- <version>` (see docs/RELEASING.md).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "Tag v$TAG does not match package.json $PKG"; exit 1; fi
      - name: Verify (typecheck, tests, build, package)
        run: npm run verify
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > dist/release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "Geekatplay 3D Layers $GITHUB_REF_NAME" \
            --notes-file dist/release-notes.md \
            $PRERELEASE \
            dist/release/geekatplay-3d-layers-*.ccx \
            dist/release/geekatplay-3d-layers.ccx \
            dist/release/SHA256SUMS.txt \
            dist/release/install-windows.cmd \
            dist/release/install-windows.ps1 \
            dist/release/install-macos.command \
            dist/release/uninstall-windows.cmd \
            dist/release/uninstall-macos.command
